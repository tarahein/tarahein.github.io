  <style>

    :root {
      --page-w: 1100px;
      --border: #e6e6e6;
      --link: #0b66c3;
      --muted: #666;
      --text: #222;
      --bg: #fff;
      --nav: #6a6a6a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.65;
    }

    a {
      color: var(--link);
    }

    .muted {
      color: var(--muted);
    }


    /* =========================
       Masthead / Navigation
       ========================= */

    .masthead {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .masthead__inner-wrap {
      max-width: var(--page-w);
      margin: 0 auto;
      padding: .7rem 1rem;
    }

    .greedy-nav {
      display: flex;
      align-items: center;
    }

    .visible-links {
      list-style: none;
      display: flex;
      gap: 1rem;
      margin: 0;
      padding: 0;
      width: 100%;
    }

    .visible-links .masthead__menu-item--lg {
      margin-right: auto;
    }

    .masthead__menu-item a {
      color: #6e6e6e;
      text-decoration: none;
      font-weight: 500;
      padding: .55rem .35rem;
      letter-spacing: .2px;
    }

    .masthead__menu-item a:hover {
      color: #3a3a3a;
      text-decoration: underline;
    }

    .masthead__menu-item--lg a {
      color: #333;
      font-weight: 700;
      font-size: 1rem;
      white-space: nowrap;
    }


    /* Hamburger menu */

    .greedy-nav > button {
      display: none;
      border: 0;
      background: transparent;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
    }

    .greedy-nav .navicon,
    .greedy-nav .navicon:before,
    .greedy-nav .navicon:after {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--nav);
      content: "";
      position: relative;
    }

    .greedy-nav .navicon:before {
      position: absolute;
      top: -6px;
    }

    .greedy-nav .navicon:after {
      position: absolute;
      top: 6px;
    }


    /* =========================
       Main Layout
       ========================= */

    #main {
      max-width: var(--page-w);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2rem;
      padding: 1.25rem 1rem 2rem;
    }

    .sidebar {
      position: sticky;
      top: 72px;
      align-self: start;
    }

    .page {
      max-width: 48rem;
    }

    .page__title {
      font-size: 1.9rem;
      margin: .25rem 0 .25rem;
    }

    .page a:hover {
      color: #0a55a4;
    }


    /* =========================
       Sidebar
       ========================= */

    .sidebar .author__avatar {
      max-width: 180px;
    }

    .author__avatar img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 50%;
      border: none;
    }

    .author__name {
      margin: .75rem 0 .25rem;
    }

    .author__bio {
      color: #7a7a7a;
      font-size: .95rem;
      margin: .25rem 0 .75rem;
    }

    .author__urls {
      list-style: none;
      margin: .75rem 0 0;
      padding: 0;
    }

    .author__urls li {
      display: flex;
      align-items: center;
      gap: .45rem;
      margin: .35rem 0;
      color: #444;
      font-size: .95rem;
    }

    .author__urls i {
      width: 1.1rem;
      text-align: center;
      font-size: .95rem;
      color: #6e6e6e;
    }

    .author__urls a {
      color: inherit;
      text-decoration: none;
      font-weight: 500;
    }

    .author__urls a:hover {
      color: var(--link);
      text-decoration: underline;
    }


    /* =========================
       Photography Masonry
       ========================= */

    .photo-masonry {
      columns: 3 280px;
      column-gap: 10px;
      margin-top: 1rem;
    }

    .photo-masonry figure {
      break-inside: avoid;
      margin: 0 0 10px;
    }

    .photo-masonry img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      border: 1px solid #e8e8e8;
    }


    /* =========================
       Mobile
       ========================= */

    @media (max-width: 900px) {

      .sidebar {
        display: none;
      }

      #main {
        display: block;
        padding: 0 1.25rem 2rem;
      }

      .greedy-nav > button {
        display: block;
      }

      .visible-links {
        display: none;
        flex-direction: column;
        align-items: flex-start;
        padding-top: .5rem;
      }

      .visible-links.open {
        display: flex;
      }

      .visible-links .masthead__menu-item--lg {
        margin-right: 0;
      }

    }

  </style>

</head>

  <!-- =========================
       Mobile navigation script
       ========================= -->

  <script>

    (function () {

      var btn = document.querySelector(
        '.greedy-nav > button'
      );

      var links = document.querySelector(
        '.visible-links'
      );

      if (btn && links) {

        btn.addEventListener(
          'click',
          function () {
            links.classList.toggle('open');
          }
        );

      }

    })();
